    <span class="sr-only">Loading...</span>
    </div>
} @else {
    @if(parties.length==0){
    <div class="flex justify-center w-full m-4">
        <div class="flex w-full items-center p-4 text-sm text-primary-100 rounded-lg bg-blue-50" role="alert">
        <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
        </svg>
        <div>
            {{ 'OFFERINGS._no_prod' | translate }}
        </div>
        </div>
    </div>
    }@else{
    <div class="relative w-full mb-4">
        <input
            type="text"
            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-3 pl-10 focus:ring-primary-100 focus:border-primary-100"
            placeholder="Search party..."
            [(ngModel)]="searchTerm"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.35-5.4a6.75 6.75 0 11-13.5 0 6.75 6.75 0 0113.5 0z"/>
        </svg>
        </div>

    <div class="rounded-2xl overflow-hidden w-full mb-4" style="border: 1px solid #D8DADE;">
        <table class="w-full text-left border-collapse">
        <thead>
        <tr style="background: #EBF0F7;">
            <th scope="col" class="px-4 py-4 w-12"><!-- Columna del Checkbox --></th>
            <th scope="col" class="px-4 py-4 text-base font-semibold text-[#324153]">{{ 'OFFERINGS._name' | translate }}</th>
        </tr>
        </thead>
        <tbody>
            @for (party of filteredParties; track $index) {
            <tr class="cursor-pointer hover:bg-[#F7F9FD]"
                style="border-top: 1px solid #EBECEE;"
                (click)="toggleSelection(party)"
                [ngClass]="getRowClass(party.id)">

                <!-- Checkbox -->
                <td class="px-4 py-4 w-12">
                <input type="radio"
                        name="partySelection"
                        class="w-4 h-4 text-primary-100 bg-white border-gray-300 focus:ring-primary-100"
                        [checked]="isSelected(party.id)"
                        (click)="$event.stopPropagation();toggleSelection(party)">
                </td>

                <td class="px-4 py-4 text-base text-[#324153]">{{ party.tradingName }}</td>
            </tr>
            }
        </tbody>
        </table>
    </div>
    }
